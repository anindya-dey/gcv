[package]
name = "gcv"
version = "0.0.1"
edition = "2021"
description = "A beautiful terminal resume renderer. Share your CV as a git repo."
authors = ["Anindya Dey"]
license = "MIT"
repository = "https://github.com/anindya-dey/gcv"
keywords = ["resume", "cv", "terminal", "cli", "tui"]
categories = ["command-line-utilities"]

[[bin]]
name = "gcv"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
ureq = "2"
unicode-width = "0.2"
textwrap = "0.16"
qrcode = "0.14"
terminal_size = "0.4"
dirs = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
