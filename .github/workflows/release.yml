name: Release

on:
  push:
    tags:
      - "v[0-9]+.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all --locked

  publish-crates:
    name: Publish to crates.io
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check whether this version is already published
        id: check
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if curl -sf "https://crates.io/api/v1/crates/gcv/${version}" >/dev/null; then
            echo "gcv ${version} is already on crates.io; skipping publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to crates.io
        if: steps.check.outputs.published == 'false'
        env:
          RAW_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${RAW_TOKEN}" ]; then
            echo "::error title=Missing secret::CARGO_REGISTRY_TOKEN is not available to this workflow. Add it under Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi
          # Trim any stray whitespace/newlines that a paste may have introduced.
          TOKEN=$(printf '%s' "${RAW_TOKEN}" | tr -d '[:space:]')
          export CARGO_REGISTRY_TOKEN="${TOKEN}"
          echo "Token present (length ${#TOKEN})."
          set +e
          cargo publish --locked 2>&1 | tee "${RUNNER_TEMP}/publish.log"
          status=${PIPESTATUS[0]}
          if [ "${status}" -ne 0 ]; then
            echo "--- cargo publish output (tail) ---"
            tail -n 20 "${RUNNER_TEMP}/publish.log"
            msg=$(tail -n 8 "${RUNNER_TEMP}/publish.log" | tr '\n' ' ' | sed 's/"/ /g')
            echo "::error title=cargo publish failed (exit ${status})::${msg}"
            exit "${status}"
          fi

  upload-assets:
    name: Build & upload ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross toolchain (musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross toolchain (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          printf '[target.aarch64-unknown-linux-gnu]\nlinker = "aarch64-linux-gnu-gcc"\n' >> .cargo/config.toml

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [ "${RUNNER_OS}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/gcv.exe" "dist/gcv-${{ matrix.target }}.exe"
          else
            cp "target/${{ matrix.target }}/release/gcv" "dist/gcv-${{ matrix.target }}"
          fi
          ls -l dist

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true

  release-notes:
    name: Attach release notes
    needs: upload-assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { flag=1; next }
            flag && /^## / { exit }
            flag { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release ${version}. See the assets below." > release_notes.md
          fi
          cat release_notes.md

      - name: Update GitHub release body
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
